name: Build Ludo APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean Res & Compile APK
        run: |
          # Remove any accidental non-xml files from res
          find res/ -type f ! -name "*.xml" -delete 2>/dev/null || true

          # Select stable build tools and android.jar
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/34.* $ANDROID_HOME/build-tools/33.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1); fi

          PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-34 $ANDROID_HOME/platforms/android-33 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$PLATFORM_DIR" ]; then PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-[0-9]* | sort -V | tail -n 1); fi

          ANDROID_JAR="$PLATFORM_DIR/android.jar"

          echo "Using Build Tools: $BUILD_TOOLS"
          echo "Using Android Jar: $ANDROID_JAR"

          export PATH="$BUILD_TOOLS:$PATH"

          mkdir -p build obj
          aapt2 compile --dir res -o build/res.zip
          aapt2 link -o build/unaligned.apk -I "$ANDROID_JAR" --manifest AndroidManifest.xml build/res.zip --java src
          javac -cp "$ANDROID_JAR" -d obj src/com/example/prankludo/*.java
          d8 --output build --lib "$ANDROID_JAR" obj/com/example/prankludo/*.class
          jar uf build/unaligned.apk -C build classes.dex
          zipalign -v -p 4 build/unaligned.apk build/aligned.apk
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AndroidDebug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out LudoKing.apk build/aligned.apk

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-APK
          path: LudoKing.apk
